<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>취향열림 - 내 취향으로 찾는 무장애 여행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .place-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .place-card:hover { transform: translateY(-6px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .chip { transition: all 0.2s ease; }
        .chip.active { background-color: #0ea5e9; color: white; border-color: #0ea5e9; }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <!-- 헤더 -->
    <header class="border-b border-zinc-800 bg-zinc-950/90 backdrop-blur fixed w-full z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-sky-500 rounded-2xl flex items-center justify-center">
                    <span class="text-white text-2xl">🌿</span>
                </div>
                <div>
                    <div class="font-semibold text-2xl">취향열림</div>
                    <div class="text-[10px] text-zinc-500 -mt-1">내 취향으로 찾는 무장애 여행</div>
                </div>
            </div>
            <button onclick="showProfileModal()" 
                    class="px-4 py-2 rounded-2xl border border-zinc-700 hover:bg-zinc-900 text-sm flex items-center gap-2">
                ⚙️ 프로필 설정
            </button>
        </div>
    </header>

    <div class="pt-16 max-w-6xl mx-auto px-6 pb-20">
        
        <!-- 히어로 -->
        <div class="text-center py-20">
            <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-zinc-900 text-sm mb-6">
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                취향대로 즐기는 여행
            </div>
            <h1 class="text-6xl font-semibold tracking-tighter mb-4">내 취향대로<br>여행하자</h1>
            <p class="text-xl text-zinc-400">좋아하는 것만 골라보세요.<br>무장애가 보장된 곳만 보여드릴게요.</p>
        </div>

        <!-- 취향 선택 -->
        <div class="mb-10">
            <div class="flex items-center justify-between mb-4 px-1">
                <div class="text-lg font-medium">어떤 여행을 좋아하세요?</div>
                <div class="text-xs text-zinc-500">마음에 드는 것 모두 선택</div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="category-chips"></div>
        </div>

        <!-- 추천 리스트 -->
        <div>
            <div class="flex items-end justify-between mb-6 px-1">
                <div>
                    <div class="text-sky-500 text-sm font-medium">실시간 추천</div>
                    <div class="text-3xl font-semibold tracking-tight">이런 곳은 어때요?</div>
                </div>
                <div class="text-sm text-zinc-500" id="result-count">8곳</div>
            </div>
            <div class="grid md:grid-cols-2 gap-6" id="place-list"></div>
        </div>
    </div>

    <!-- 모달들 (간단 버전) -->
    <div id="place-modal" onclick="this.classList.add('hidden')" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4">
        <div onclick="event.stopImmediatePropagation()" class="bg-zinc-900 rounded-3xl w-full max-w-2xl p-8">
            <div class="flex justify-between mb-4">
                <div id="modal-name" class="text-3xl font-semibold"></div>
                <button onclick="document.getElementById('place-modal').classList.add('hidden')" class="text-2xl">✕</button>
            </div>
            <div id="modal-map" class="h-72 w-full rounded-2xl mb-6 border border-zinc-800"></div>
            <div id="modal-description" class="text-lg leading-relaxed mb-6"></div>
            <div class="flex gap-2 flex-wrap mb-6" id="modal-badges"></div>
            
            <button onclick="showReviewModal()" 
                    class="w-full py-3 bg-white text-black rounded-2xl font-semibold">방문 릴레이 참여하기</button>
        </div>
    </div>

    <script>
        // 데이터
        const places = [ /* 이전과 동일한 8개 장소 데이터 */ 
            {id:1, name:"경복궁", category:["문화","역사","사진"], accessibility:5, description:"휠체어 완전 접근 가능", image:"https://picsum.photos/id/1015/600/400", lat:37.5776, lng:126.9769, address:"서울 종로구 세종로 1-1", badges:["휠체어 OK","점자 안내"]},
            {id:2, name:"남산서울타워", category:["사진","휴식","뷰"], accessibility:4, description:"엘리베이터 완비", image:"https://picsum.photos/id/1033/600/400", lat:37.5512, lng:126.9882, address:"서울 용산구 남산공원길 105", badges:["휠체어 OK","엘리베이터"]},
            {id:3, name:"성산일출봉", category:["자연","힐링","사진"], accessibility:4, description:"제주 대표 무장애 명소", image:"https://picsum.photos/id/1036/600/400", lat:33.4626, lng:126.9364, address:"제주 서귀포시 성산읍", badges:["휠체어 OK","경사로"]},
            {id:4, name:"해운대 해수욕장", category:["자연","음식","휴식"], accessibility:5, description:"저상버스 바로 앞", image:"https://picsum.photos/id/1040/600/400", lat:35.1595, lng:129.1604, address:"부산 해운대구 우동", badges:["휠체어 OK","저상버스"]},
            {id:5, name:"서울숲", category:["자연","가족","휴식"], accessibility:5, description:"유모차 천국", image:"https://picsum.photos/id/106/600/400", lat:37.5445, lng:127.0378, address:"서울 성동구 뚝섬로 273", badges:["휠체어 OK","유모차 최고"]},
            {id:6, name:"광화문광장", category:["문화","사진","역사"], accessibility:5, description:"광장 전체 평지", image:"https://picsum.photos/id/1074/600/400", lat:37.5725, lng:126.9770, address:"서울 종로구 세종대로 172", badges:["휠체어 OK","점자 블록"]},
            {id:7, name:"인사동 쌈지길", category:["문화","음식","체험"], accessibility:3, description:"전통문화 골목", image:"https://picsum.photos/id/1080/600/400", lat:37.5744, lng:126.9850, address:"서울 종로구 인사동길 44", badges:["전통문화","맛집"]},
            {id:8, name:"한강공원 여의도", category:["자연","휴식","사진"], accessibility:5, description:"한강변 완전 평지", image:"https://picsum.photos/id/1032/600/400", lat:37.5267, lng:126.9342, address:"서울 영등포구 여의동로 330", badges:["휠체어 최고","야경 좋음"]}
        ];
        const categories = ["자연","문화","음식","사진","휴식","체험","가족","역사"];

        let selectedCategories = [];

        function init() {
            console.log("✅ 앱 초기화 시작");
            renderCategoryChips();
            renderPlaces();
            console.log("✅ 초기화 완료");
        }

        function renderCategoryChips() {
            const container = document.getElementById('category-chips');
            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `chip px-6 py-4 rounded-3xl border text-lg font-medium bg-zinc-900 border-zinc-800`;
                btn.textContent = cat;
                btn.onclick = () => {
                    if (selectedCategories.includes(cat)) {
                        selectedCategories = selectedCategories.filter(c => c !== cat);
                        btn.classList.remove('active','bg-sky-500','border-sky-500');
                    } else {
                        selectedCategories.push(cat);
                        btn.classList.add('active','bg-sky-500','border-sky-500');
                    }
                    renderPlaces();
                };
                container.appendChild(btn);
            });
        }

        function renderPlaces() {
            const container = document.getElementById('place-list');
            container.innerHTML = '';
            const filtered = places.filter(p => selectedCategories.length === 0 || selectedCategories.some(c => p.category.includes(c)))
                                  .sort((a,b) => b.accessibility - a.accessibility);
            
            document.getElementById('result-count').textContent = `${filtered.length}곳`;

            filtered.forEach(place => {
                const card = document.createElement('div');
                card.className = 'place-card bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800 cursor-pointer';
                card.innerHTML = `
                    <div class="relative h-56"><img src="${place.image}" class="w-full h-full object-cover"></div>
                    <div class="p-6">
                        <div class="font-semibold text-2xl">${place.name}</div>
                        <div class="text-sm text-zinc-400 mt-1 mb-4">${place.address}</div>
                        <div class="flex justify-between items-center">
                            <div class="text-sm text-zinc-400">${place.category.join(' · ')}</div>
                            <button onclick="event.stopImmediatePropagation(); showPlaceModal(${place.id})" 
                                    class="px-5 py-2 bg-white text-black rounded-2xl text-sm font-medium">상세 보기</button>
                        </div>
                    </div>
                `;
                card.onclick = () => showPlaceModal(place.id);
                container.appendChild(card);
            });
        }

        function showPlaceModal(placeId) {
            const place = places.find(p => p.id === placeId);
            if (!place) return;

            document.getElementById('modal-name').textContent = place.name;
            document.getElementById('modal-description').textContent = place.description;
            document.getElementById('modal-badges').innerHTML = place.badges.map(b => 
                `<div class="px-4 py-1 bg-emerald-950 text-emerald-400 rounded-2xl text-sm">✓ ${b}</div>`
            ).join('');

            const modal = document.getElementById('place-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // 지도
            setTimeout(() => {
                const mapContainer = document.getElementById('modal-map');
                mapContainer.innerHTML = '';
                const map = L.map(mapContainer).setView([place.lat, place.lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                L.marker([place.lat, place.lng]).addTo(map);
            }, 300);
        }

        function showProfileModal() {
            alert("프로필 설정 기능은 곧 추가될 예정입니다!");
        }

        // 시작
        window.onload = function() {
            console.log("페이지 로드 완료");
            init();
        }
    </script>
</body>
</html>
