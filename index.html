<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>취향열림 - 내 취향으로 찾는 무장애 여행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        .place-card {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .place-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 
                        0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        
        .chip {
            transition: all 0.2s ease;
        }
        
        .chip.active {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }
        
        .modal {
            animation: modalPop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .leaflet-container {
            border-radius: 24px;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <!-- 헤더 -->
    <header class="border-b border-zinc-800 bg-zinc-950/90 backdrop-blur-lg fixed w-full z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-sky-500 rounded-2xl flex items-center justify-center">
                    <span class="text-white text-xl">🌿</span>
                </div>
                <div>
                    <div class="font-semibold text-2xl tracking-tight">취향열림</div>
                    <div class="text-[10px] text-zinc-500 -mt-1">내 취향으로 찾는 무장애 여행</div>
                </div>
            </div>

            <button onclick="showProfileModal()" 
                    class="flex items-center gap-2 px-4 py-2 rounded-2xl border border-zinc-700 hover:bg-zinc-900 text-sm">
                ⚙️ 프로필 설정
            </button>
        </div>
    </header>

    <div class="pt-16 max-w-6xl mx-auto px-6 pb-20">
        
        <!-- 히어로 -->
        <div class="text-center py-16">
            <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-zinc-900 text-sm mb-6">
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                취향대로 즐기는 여행
            </div>
            
            <h1 class="text-6xl font-semibold tracking-tighter mb-4">
                내 취향대로<br />여행하자
            </h1>
            <p class="text-xl text-zinc-400 max-w-md mx-auto">
                좋아하는 것만 골라보세요.<br />무장애가 보장된 곳만 보여드릴
